[project]
name = "pydantic-fabricated"
dynamic = ["version"]
description = "Metaclass for fabricating subclasses from dictionaries inside Pydantic models."
authors = [{ name = "KRunchPL", email = "krunchfrompoland@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "pydantic>=2.11.9,<3.0.0",
]

[dependency-groups]
dev = [
    "pydoclint",
    "flake8",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "pydantic-settings",
]

[project.urls]
homepage = "https://github.com/KRunchPL/pydantic-fabricated"
repository = "https://github.com/KRunchPL/pydantic-fabricated"
documentation = "https://github.com/KRunchPL/pydantic-fabricated"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_fabricated"]

[tool.hatch.version]
scheme = "semver"
path = "version.txt"
pattern = "(?P<version>.*)"

[build-system]
requires = ["hatchling", "hatch-semver"]
build-backend = "hatchling.build"

[tool.uv]
system-certs = true
